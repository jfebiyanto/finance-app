services:
  app:
    build:
      context: ../
      dockerfile: Dockerfile
    container_name: finance-app
    restart: unless-stopped
    # No ports exposed to host — app is accessed only via Cloudflare Tunnel
    environment:
      - APP_NAME=${APP_NAME}
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL}
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=finance_app
      - DB_USERNAME=finance_user
      - DB_PASSWORD=${DB_PASSWORD}
      - SESSION_DRIVER=database
      - QUEUE_CONNECTION=database
      - CACHE_STORE=database
      - MAIL_MAILER=${MAIL_MAILER}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME}
      - TRUSTED_PROXIES=*  # Trust Cloudflare IPs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - finance-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: finance-tunnel
    restart: unless-stopped
    command: tunnel --url http://app:80
    depends_on:
      - app
    networks:
      - finance-network

  db:
    image: mysql:8.0
    container_name: finance-db
    restart: unless-stopped
    # Only accessible from within the Docker network — no host port exposure
    expose:
      - "3306"
    environment:
      MYSQL_DATABASE: finance_app
      MYSQL_USER: finance_user
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - finance-network

volumes:
  db-data:

networks:
  finance-network:
    driver: bridge
